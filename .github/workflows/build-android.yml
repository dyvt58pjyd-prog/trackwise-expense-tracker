name: Build Android Native APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets (Vite)
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android Project
        run: |
          chmod +x android/gradlew
          npx cap copy android || true

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackWise-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: TrackWise Native Android App
          body: |
            ### 📱 TrackWise Native Android APK
            - **100% Offline-First Personal Finance Tracker**
            - **Neon PostgreSQL Cloud Sync Enabled**
            - Download `app-debug.apk` below and install directly on your Android phone!
            
            **Credits: Made by Anurag Bawaskar**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
